services:
  maher:
    build:
      context: ./repo
      dockerfile: Dockerfile
    container_name: maher
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.maher.entrypoints=http"
      - "traefik.http.routers.maher.rule=Host(`maher.${DOMAIN}`)"
      - "traefik.http.middlewares.maher-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.maher.middlewares=maher-https-redirect"
      - "traefik.http.routers.maher-secure.entrypoints=https"
      - "traefik.http.routers.maher-secure.rule=Host(`maher.${DOMAIN}`)"
      - "traefik.http.routers.maher-secure.tls=true"
      - "traefik.http.routers.maher-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.maher-secure.service=maher"
      - "traefik.http.services.maher.loadbalancer.server.port=5000"

networks:
  proxy:
    external: true
