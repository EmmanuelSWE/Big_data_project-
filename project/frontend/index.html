<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAHER Wildlife Identification</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg class="safari-bg" aria-hidden="true" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice">
    <rect x="0" y="0" width="800" height="600" fill="var(--sky)" />
    <path d="M0,470 C120,445 230,495 340,475 C460,453 560,490 680,465 C730,455 780,470 800,462 L800,600 L0,600 Z" fill="var(--ground)" />
    <g fill="var(--tree)" opacity="0.9">
      <rect x="196" y="390" width="7" height="90" />
      <ellipse cx="199" cy="380" rx="78" ry="24" />
      <ellipse cx="150" cy="390" rx="40" ry="15" />
      <ellipse cx="248" cy="390" rx="40" ry="15" />
    </g>
    <g fill="var(--tree)" opacity="0.75">
      <rect x="593" y="415" width="5" height="65" />
      <ellipse cx="595" cy="408" rx="52" ry="16" />
    </g>
    <g fill="var(--tree)" opacity="0.6">
      <path d="M40,478 q10,-22 20,0 q10,-30 20,0 q10,-22 20,0 l0,6 l-60,0 Z" />
      <path d="M660,472 q8,-18 16,0 q8,-24 16,0 q8,-18 16,0 l0,5 l-48,0 Z" />
    </g>
  </svg>

  <header>
    <h1>MAHER Wildlife Identification</h1>
    <p class="subtitle">Upload a photo of a hyena, leopard, macaque, or dog.</p>
  </header>

  <main>
    <section class="panel upload-panel">
      <h2>Upload Image</h2>
      <label class="dropzone" for="image-input">
        <img id="preview" alt="" hidden />
        <span id="dropzone-label">Choose an image&hellip;</span>
      </label>
      <input id="image-input" type="file" accept="image/*" hidden />

      <div class="threshold-row">
        <label><input type="checkbox" id="flag-unrecognised-species" checked /> Flag unrecognised species</label>
        <input type="number" id="species-threshold" min="0" max="1" step="0.05" value="0.85" />
      </div>
      <div class="threshold-row">
        <label><input type="checkbox" id="flag-unknown" checked /> Flag low-confidence matches as unknown</label>
        <input type="number" id="threshold" min="0" max="1" step="0.05" value="0.6" />
      </div>

      <button id="identify-btn" disabled>Identify</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="panel result-panel" id="result-panel" hidden>
      <h2>Result</h2>
      <div class="result-row">
        <span class="result-label">Species</span>
        <span id="species-value" class="result-value">&mdash;</span>
      </div>
      <div class="result-row">
        <span class="result-label">Individual</span>
        <span id="individual-value" class="result-value">&mdash;</span>
      </div>
      <div class="result-row">
        <span class="result-label">Similarity</span>
        <span id="similarity-value" class="result-value">&mdash;</span>
      </div>
      <h3>Top matches</h3>
      <ul id="matches-list" class="matches-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
