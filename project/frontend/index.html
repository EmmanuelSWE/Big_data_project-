<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAHER Wildlife Identification</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MAHER Wildlife Identification</h1>
    <p class="subtitle">Upload a photo of a hyena, leopard, macaque, or dog.</p>
  </header>

  <main>
    <section class="panel upload-panel">
      <h2>Upload Image</h2>
      <label class="dropzone" for="image-input">
        <img id="preview" alt="" hidden />
        <span id="dropzone-label">Choose an image&hellip;</span>
      </label>
      <input id="image-input" type="file" accept="image/*" hidden />

      <div class="threshold-row">
        <label><input type="checkbox" id="flag-unknown" checked /> Flag low-confidence matches as unknown</label>
        <input type="number" id="threshold" min="0" max="1" step="0.05" value="0.6" />
      </div>

      <button id="identify-btn" disabled>Identify</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="panel result-panel" id="result-panel" hidden>
      <h2>Result</h2>
      <div class="result-row">
        <span class="result-label">Species</span>
        <span id="species-value" class="result-value">&mdash;</span>
      </div>
      <div class="result-row">
        <span class="result-label">Individual</span>
        <span id="individual-value" class="result-value">&mdash;</span>
      </div>
      <div class="result-row">
        <span class="result-label">Similarity</span>
        <span id="similarity-value" class="result-value">&mdash;</span>
      </div>
      <h3>Top matches</h3>
      <ul id="matches-list" class="matches-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
